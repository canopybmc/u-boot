%YAML 1.2
---
$id: "http://devicetree.org/schemas/sysinfo/hpe,gxp-sysinfo.yaml#"
$schema: "http://devicetree.org/meta-schemas/core.yaml#"

title: HPE GXP BMC Sysinfo

maintainers:
  - Nick Hawkins <nick.hawkins@hpe.com>
  - Jean-Marie Verdun <verdun@hpe.com>

description: |
  Sysinfo driver for HPE GXP BMC SoCs providing board identification
  through SMBIOS-compatible identifiers. Reads serial and part numbers
  from nvmem cells for both system-level and baseboard-level VPD.

properties:
  compatible:
    const: hpe,gxp-sysinfo

  nvmem-cells:
    minItems: 2
    maxItems: 4
    description:
      References to nvmem cells providing board VPD fields.

  nvmem-cell-names:
    minItems: 2
    maxItems: 4
    items:
      enum:
        - serial-number
        - part-number
        - pca-serial-number
        - pca-part-number

  bootph-all:
    type: boolean

required:
  - compatible
  - nvmem-cells
  - nvmem-cell-names

additionalProperties: false

examples:
  - |
    sysinfo {
        compatible = "hpe,gxp-sysinfo";
        nvmem-cells = <&serial_number>, <&part_number>,
                      <&pca_serial_number>, <&pca_part_number>;
        nvmem-cell-names = "serial-number", "part-number",
                           "pca-serial-number", "pca-part-number";
    };
